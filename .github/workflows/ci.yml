name: PocketPad CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint:
    name: Python Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Strict Flake8 Linting
        run: |
          flake8 . --count --max-line-length=120 --exclude=.gradle,build,dist,app,.system_generated,.git --statistics

      - name: Check Black Code Formatting
        run: |
          black --check . --exclude "(\.gradle|build|dist|app)" --line-length 120

      - name: Check isort Import Order
        run: |
          isort --check-only . --skip .gradle --skip build --skip dist --skip app

  python-tests:
    name: Python Tests (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: python-lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v -m "not hardware"

  android:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketpad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
