[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketpad"
version = "1.1.0"
description = "Smartphone-based racing controller for PC games"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Praneeth9346", email = "praneeth@example.com"}
]
keywords = ["racing", "controller", "gamepad", "forza"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "vgamepad>=0.3.3",
    "websockets>=10.0,<13.0",
    "cryptography>=38.0,<44.0",
    "qrcode>=7.0,<8.0",
    "pillow>=9.0,<11.0",
    "pywebview>=4.0,<6.0",
    "pystray>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.20",
    "black>=22.0",
    "flake8>=5.0",
    "isort>=5.10",
]

[project.urls]
Homepage = "https://github.com/Praneeth9346/PocketPad"
Repository = "https://github.com/Praneeth9346/PocketPad"
Documentation = "https://github.com/Praneeth9346/PocketPad#readme"
"Bug Tracker" = "https://github.com/Praneeth9346/PocketPad/issues"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
